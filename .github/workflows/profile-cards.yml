name: Profile cards

# Renders the hero, tech stack, activity, and contact cards shown in README.md /
# README.ko.md, publishes them to the profile-cards branch (one commit, replaced on
# every run), and keeps the README stack, activity, and contact blocks in sync.
on:
  schedule:
    - cron: "17 15 * * *"  # every day at 00:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: write

concurrency: profile-cards

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render cards and sync the README blocks
        env:
          # The owner's token counts private repositories; without the secret the
          # default token is used and the cards show public numbers only.
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          OWNER_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN != '' }}
        run: python3 .github/scripts/profile_cards.py out --sync-readme

      - name: Publish cards to the profile-cards branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b profile-cards
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update profile cards"
          git push -q -f "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" profile-cards

      - name: Commit README blocks if they changed
        run: |
          if [ -n "$(git status --porcelain README.md README.ko.md)" ]; then
            git config user.name "udonsari0101"
            git config user.email "yeappidw@gmail.com"
            git add README.md README.ko.md
            git commit -q -m "Sync README blocks"
            git pull -q --rebase origin main  # main may have moved while the job ran
            git push -q origin HEAD:main
          fi
