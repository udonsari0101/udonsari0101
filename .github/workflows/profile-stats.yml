name: Profile stats

# Renders the activity cards shown in README.md / README.ko.md and publishes them
# to the profile-stats branch (one commit, replaced on every run).
on:
  schedule:
    - cron: "17 15 * * *"  # every day at 00:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: write

concurrency: profile-stats

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render cards
        env:
          # A token of the profile owner counts private repositories; without the
          # secret the default token is used and only public data is shown.
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
        run: python3 .github/scripts/profile_stats.py out

      - name: Publish to the profile-stats branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b profile-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update profile stats"
          git push -q -f "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" profile-stats
