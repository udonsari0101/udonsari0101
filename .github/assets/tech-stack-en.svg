<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI Variable Text','Segoe UI','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif}.d{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI','Noto Sans KR','Malgun Gothic',sans-serif}.in{animation:in .7s ease-out both}@keyframes in{from{opacity:0}}.up{animation:up .7s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(6px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
